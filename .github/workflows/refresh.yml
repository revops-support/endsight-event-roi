name: Refresh Endsight Event ROI

on:
  schedule:
    # 13:47 UTC = 5:47 AM Pacific (6:47 AM during daylight time). The page's Refresh button runs it on demand.
    - cron: '47 13 * * *'
  workflow_dispatch:

concurrency:
  group: endsight-event-roi
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      HUBSPOT_TEMPLATE_PATH: endsight/endsight-event-roi.html
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Pull data from Endsight HubSpot
        run: node scripts/fetch-data.mjs
        env:
          HUBSPOT_TOKEN: ${{ secrets.ENDSIGHT_HUBSPOT_TOKEN }}
          TIME_ZONE: America/Los_Angeles
          HUBSPOT_PORTAL_ID: '2823558'
          REPORT_BLINQ_TAGS: '446645630'
          REPORT_CONTACTS_BY_STAGE: '446661489'
          # Campaigns without an Event date are listed by start date if they started within this many days.
          START_DATE_LOOKBACK_DAYS: '365'
      - name: Build the page
        run: node scripts/render.mjs
        env:
          # The Cloudflare Worker behind the Refresh data button (cloudflare-worker/).
          # Set it under Settings > Secrets and variables > Actions > Variables. Unset hides the button.
          REFRESH_ENDPOINT: ${{ vars.REFRESH_ENDPOINT }}
      - name: Publish to HubSpot
        run: node scripts/publish-hubspot.mjs
        env:
          HUBSPOT_PUBLISH_TOKEN: ${{ secrets.REVOPS_HUBSPOT_CONTENT_TOKEN }}
