name: Refresh Endsight Event ROI

on:
  schedule:
    # Every morning, weekends included: 13:47 UTC = 5:47 AM Pacific (6:47 AM during daylight time)
    - cron: '47 13 * * *'
    # Hourly through the Pacific workday, Monday to Friday, so new campaigns show up within the hour.
    # 14:07 to 23:07 UTC Mon-Fri, then 00:07 to 03:07 UTC Tue-Sat = 6:07 AM to 7:07 PM Pacific (standard time).
    - cron: '7 14-23 * * 1-5'
    - cron: '7 0-3 * * 2-6'
  workflow_dispatch:

concurrency:
  group: endsight-event-roi
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Pull data from Endsight HubSpot
        run: node scripts/fetch-data.mjs
        env:
          HUBSPOT_TOKEN: ${{ secrets.ENDSIGHT_HUBSPOT_TOKEN }}
          TIME_ZONE: America/Los_Angeles
          HUBSPOT_PORTAL_ID: '2823558'
          REPORT_BLINQ_TAGS: '446645630'
          REPORT_CONTACTS_BY_STAGE: '446661489'
      - name: Build the page
        run: node scripts/render.mjs
      - name: Publish to HubSpot
        run: node scripts/publish-hubspot.mjs
        env:
          HUBSPOT_PUBLISH_TOKEN: ${{ secrets.REVOPS_HUBSPOT_CONTENT_TOKEN }}
          HUBSPOT_TEMPLATE_PATH: endsight/endsight-event-roi.html
